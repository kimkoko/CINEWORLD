<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CINEWORLD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="swiper.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <header id="header">
        <div class="container">
            <div class="header">
                <h1><a href="index.html"><img src="img/logo.png" alt="CINEWORLD"></a></h1>
                <nav class="nav">
                    <ul>
                        <li><a href="bookings.html">Bookings</a></li>
                        <li><a href="tickets.html">Tickets</a></li>
                        <li><a href="events.html">Events</a></li>
                        <li><a href="login.html">Login</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section id="banner">
        <div class="slider">
            <div class="swiper-container">
                <div class="swiper-wrapper">
                    <div class="swiper-slide first"></div>
                    <div class="swiper-slide second"></div>
                    <div class="swiper-slide third"></div>
                </div>
                <div class="swiper-pagination"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
            </div>
        </div>
    </section>

    <section id="chart">
        <div class="container">
            <div class="movie">
                <div class="title">Recommended Movies<hr></div>
                <div class="movieTitle">
                    <ul>
                        <li class="tap active" data-tab="contentF"><a href="#chart">Movie Chart</a></li>
                        <li class="tap" data-tab="contentS"><a href="#chart">Coming Soon</a></li>
                        <li class="tap" data-tab="contentT"><a href="#chart">Recent Releases</a></li>
                    </ul>
                </div>
                <div class="movieChart">
                    <div class="content" id="contentF"></div>
                    <div class="contents" id="contentS" style="display:none"></div>
                    <div class="contents" id="contentT" style="display:none"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="trailer">
        <div class="container">
            <div class="trailer">
                <h2>Trailer</h2><hr>
                <div class="trailerVid">
                    <p id="trailer-label">Minari</p>
                    <iframe id="main-trailer" src="https://www.youtube.com/embed/KQ0gFidlro8" title="Minari trailer" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
                <div class="trailerInfo">
                    <h3>Other Trailers</h3>
                    <div id="trailer-side"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="event">
        <div class="container">
            <div class="event">
                <h2>Event<hr></h2>
                <div class="eventContent">
                    <ul>
                        <li><a href="events.html?id=6"><img src="img/event1.jpeg" alt="Flipped re-release"></a></li>
                        <li><a href="events.html?id=5"><img src="img/event2.jpeg" alt="Gone with the Wind re-release"></a></li>
                        <li><a href="events.html?id=4"><img src="img/event3.jpeg" alt="VISA discount"></a></li>
                        <li><a href="events.html?id=3"><img src="img/event4.jpeg" alt="Ilsan opening"></a></li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="logo">
                <img src="img/logo.png" alt="logo">
            </div>
            <div class="sns">
                <ul>
                    <li class="icon insta"><a href="https://www.instagram.com/cineworld190/" target="_blank"><img src="img/instagram.png" alt="instagram"></a></li>
                    <li class="icon twt"><a href="https://twitter.com/cineworld190" target="_blank"><img src="img/twitter.png" alt="twitter"></a></li>
                    <li class="icon fb"><a href="https://www.facebook.com/" target="_blank"><img src="img/facebook.png" alt="facebook"></a></li>
                </ul>
            </div>
        </div>
        <div class="container">
            <div class="footerInfo">
                <ul>
                    <li>27F, 300, Olympic-ro, Songpa-gu, Seoul, Republic of Korea</li>
                    <li>About Us Terms&amp;Conditions Privacy Policy</li>
                    <li>&copy; CINEWORLD. All Rights Reserved</li>
                </ul>
            </div>
        </div>
    </footer>

    <script src="swiper.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/common.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
